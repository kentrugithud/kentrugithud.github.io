<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Правила сообщества</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .rules-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        .rules-title {
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8em;
        }
        .rules-list {
            list-style-type: none;
            padding: 0;
        }
        .rules-list li {
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50; /* Зеленая полоска слева */
            border-radius: 4px;
        }
        .rules-list li:nth-child(2) {
            border-left-color: #ff9800; /* Оранжевая для 2-го правила */
        }
        .rules-list li:nth-child(3) {
            border-left-color: #2196F3; /* Синяя для 3-го правила */
        }
        .rules-list li:nth-child(4) {
            border-left-color: #f44336; /* Красная для 4-го правила */
        }
    </style>
</head>
<body>
    <div class="rules-container">
        <h1 class="rules-title">Правила нашего сообщества</h1>
        <ol class="rules-list">
            <li><strong>Материться можно, но без лексики.</strong></li>
            <li><strong>Никакой рекламы (автору можно).</strong></li>
            <li><strong>Можно делиться советами, общаться, предложить идеи, прислать новости, присылать мемы.</strong></li>
            <li><strong>Никакое оскорбление (не сильное).</strong></li>
        </ol>
    </div>
</body>
</html>
